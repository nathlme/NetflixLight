<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/output.css">
    <title>Connexion</title>
</head>
<body class="min-h-screen bg-black text-white">
    <div class="relative min-h-screen flex items-center justify-center bg-[url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974&auto=format&fit=crop')] bg-cover bg-center">
        
        <div class="absolute inset-0 bg-black/70"></div>

        <div class="relative z-10 w-full max-w-md rounded-lg bg-black/75 px-8 py-10 shadow-2xl">
            <form class="space-y-5" id="loginForm" method="POST" action="/login">
                <h1 class="text-3xl font-bold">Connexion</h1>

                <div>
                    <label for="email" class="mb-2 block text-sm text-gray-300">Email</label>
                    <input
                        class="w-full rounded-md border border-transparent bg-gray-700/80 px-4 py-3 text-white placeholder-gray-400 outline-none focus:border-white"
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Votre email"
                    >
                </div>

                <div>
                    <label for="password" class="mb-2 block text-sm text-gray-300">Mot de passe</label>
                    <input
                        class="w-full rounded-md border border-transparent bg-gray-700/80 px-4 py-3 text-white placeholder-gray-400 outline-none focus:border-white"
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Votre mot de passe"
                    >
                </div>

                <p id="message" class="min-h-[20px] text-sm text-red-500"></p>

                <button
                    class="w-full rounded-md bg-red-600 py-3 font-semibold transition hover:bg-red-700"
                    type="submit"
                >
                    Se connecter
                </button>
            </form>

            <p class="mt-6 text-sm text-gray-400">
                Pas encore de compte ?
                <a href="/register" class="text-white hover:underline">Inscrivez-vous !</a>
            </p>
        </div>
    </div>

    <script src="/static/javaScript/login.js"></script>
</body>
</html>
