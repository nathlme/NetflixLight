<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/css/output.css">
  <title>Lecteur Vidéo</title>
</head>
<body class="bg-black text-white m-0 p-0 overflow-hidden h-screen w-screen flex flex-col">
  <!-- En-tête de retour -->
  <div class="absolute top-0 left-0 w-full p-4 z-50 flex justify-between items-center bg-gradient-to-b from-black/80 to-transparent">
    <button onclick="history.back()" class="text-white hover:text-gray-300 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Retour
    </button>
  </div>

  <!-- Conteneur Iframe -->
  <div class="flex-1 w-full h-full">
    <iframe 
      id="videoPlayer" 
      class="w-full h-full border-none" 
      allowfullscreen 
      src="">
    </iframe>
  </div>

  <script src="/js/player.js"></script>
</body>
</html>
