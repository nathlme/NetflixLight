<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/static/css/output.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #playerRoot {
      position: fixed;
      inset: 0;
    }

    #videoPlayer {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
  <title>Lecteur Vidéo</title>
</head>
<body class="bg-black text-white">
  <div id="playerRoot" class="flex flex-col">
  <!-- En-tête de retour -->
  <div class="absolute top-0 left-0 w-full p-4 z-50 flex justify-between items-center bg-linear-to-b from-black/80 to-transparent">
    <button onclick="history.back()" class="text-white hover:text-gray-300 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Retour
    </button>
  </div>

  <div class="flex-1 w-full h-full">
    <iframe 
      id="videoPlayer" 
      class="w-full h-full border-none" 
      allowfullscreen 
      src="">
    </iframe>
  </div>
  </div>

  <script src="/js/pwa.js?v=4"></script>
  <script src="/js/player.js?v=4"></script>
</body>
</html>
