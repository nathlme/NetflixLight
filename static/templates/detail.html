<main class="bg-gray-950 min-h-screen text-white pb-12 w-full">
    <!-- Hero/Backdrop -->
    <div id="detail-hero" class="relative h-[60vh] md:h-[75vh] w-full bg-gray-900">
        <img id="detail-backdrop" src="https://via.placeholder.com/2000x1000" alt="Backdrop" class="w-full h-full object-cover object-top opacity-50">
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/40 to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-gray-950 via-gray-950/60 to-transparent w-full md:w-2/3"></div>

        <!-- Content Info -->
        <div class="absolute bottom-0 md:bottom-[10%] left-4 md:left-12 flex flex-col md:flex-row gap-6 md:gap-12 w-full max-w-6xl z-10 p-4 md:p-0">
            <!-- Poster -->
            <img id="detail-poster" src="https://via.placeholder.com/400x600" alt="Poster" class="w-32 md:w-56 lg:w-72 aspect-[2/3] object-cover rounded-md shadow-2xl ring-1 ring-gray-600 hidden md:block">

            <!-- Meta -->
            <div class="flex flex-col justify-end space-y-4">
                <h1 id="detail-title" class="text-3xl md:text-5xl lg:text-6xl font-bold tracking-tight drop-shadow-lg uppercase text-white">Titre du Film</h1>
                
                <div class="flex flex-wrap items-center gap-3 text-sm md:text-base text-gray-300 font-medium">
                    <span id="detail-year">2024</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
                    <span id="detail-runtime">1h 45m</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
                    <span id="detail-rating" class="flex items-center gap-1 text-green-400">
                        <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.29a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                        8.5
                    </span>
                </div>

                <div id="detail-genres" class="flex flex-wrap gap-2 mt-2 text-xs md:text-sm">
                    <!-- Genres -->
                </div>

                <p id="detail-overview" class="text-sm md:text-lg text-gray-300 line-clamp-4 md:line-clamp-none max-w-2xl mt-4 leading-relaxed">
                    Synopsis manquant...
                </p>

                <div class="mt-8 flex gap-4">
                    <button class="bg-white text-black px-6 md:px-10 py-2.5 rounded hover:bg-gray-300 transition font-bold flex items-center justify-center gap-2">
                        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 
                        <span class="text-lg">Lecture</span>
                    </button>
                    <button class="bg-gray-600/70 border border-gray-500 text-white rounded px-4 py-2 hover:bg-gray-500 transition" aria-label="Ajouter à ma liste" title="Ajouter à ma liste">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cast & Similar -->
    <div class="px-4 md:px-12 mt-12 md:mt-24 space-y-12">
        <section>
            <h2 class="text-xl md:text-2xl font-bold text-gray-100 mb-6">Acteurs principaux</h2>
            <div id="detail-cast" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 md:gap-6">
                <!-- Casting -->
            </div>
        </section>

        <section>
            <h2 class="text-xl md:text-2xl font-bold text-gray-100 mb-6">Titres similaires</h2>
            <div id="detail-similar" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 md:gap-6">
                <!-- Similaires -->
            </div>
        </section>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    // on récupère type et id depuis l'url par ex /content/movie/123
    const pathParts = window.location.pathname.split('/');
    const type = pathParts[2]; // movie ou tv
    const id = pathParts[3];

    if (!type || !id) return;

    try {
        const resDetail = await fetch(`/api/tmdb/${type}/${id}?language=fr-FR&append_to_response=credits,similar`);
        const item = await resDetail.json();

        if (item.success === false) {
            document.getElementById('detail-title').textContent = "Contenu introuvable";
            return;
        }

        const title = item.title || item.name;
        const orgTitle = item.original_title || item.original_name;
        const releaseDate = item.release_date || item.first_air_date || '';
        const year = releaseDate ? releaseDate.split('-')[0] : '';
        const runtime = type === 'movie' 
            ? (item.runtime ? \`\${Math.floor(item.runtime/60)}h \${item.runtime%60}m\` : '') 
            : (item.number_of_seasons ? \`\${item.number_of_seasons} Saison(s)\` : '');
        
        const rating = item.vote_average ? item.vote_average.toFixed(1) : '?';
        const overview = item.overview || "Aucune description trouvée pour ce contenu.";

        document.getElementById('detail-title').textContent = title;
        document.getElementById('detail-year').textContent = year;
        document.getElementById('detail-runtime').textContent = runtime;
        document.getElementById('detail-rating').innerHTML = \`<svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.29a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>\${rating}\`;
        document.getElementById('detail-overview').textContent = overview;

        if (item.backdrop_path) {
            document.getElementById('detail-backdrop').src = \`https://image.tmdb.org/t/p/original\${item.backdrop_path}\`;
        }
        if (item.poster_path) {
            document.getElementById('detail-poster').src = \`https://image.tmdb.org/t/p/w500\${item.poster_path}\`;
        }

        const genresContainer = document.getElementById('detail-genres');
        if (item.genres) {
            genresContainer.innerHTML = item.genres.map(g => \`<span class="px-2 py-1 bg-gray-800 rounded border border-gray-700">\${g.name}</span>\`).join('');
        }

        // Casting
        const castContainer = document.getElementById('detail-cast');
        if (item.credits && item.credits.cast) {
            const castH = item.credits.cast.slice(0, 6).map(c => {
                const img = c.profile_path ? \`https://image.tmdb.org/t/p/w185\${c.profile_path}\` : 'https://via.placeholder.com/185x278?text=Photo';
                return \`
                    <div class="flex flex-col items-center bg-gray-800/50 rounded p-2 text-center transition hover:bg-gray-700">
                        <img src="\${img}" class="w-16 h-16 md:w-20 md:h-20 rounded-full object-cover mb-3" alt="\${c.name}">
                        <h4 class="font-bold text-sm text-gray-200">\${c.name}</h4>
                        <p class="text-xs text-gray-500">\${c.character}</p>
                    </div>
                \`;
            }).join('');
            castContainer.innerHTML = castH;
        }

        // Similaires
        const similarContainer = document.getElementById('detail-similar');
        if (item.similar && item.similar.results) {
            const simH = item.similar.results.slice(0, 6).map(s => {
                const img = s.poster_path ? \`https://image.tmdb.org/t/p/w500\${s.poster_path}\` : 'https://via.placeholder.com/400x600?text=No+Poster';
                const sType = s.media_type || type;
                return \`
                    <div onclick="window.location.href='/content/\${sType}/\${s.id}'" class="aspect-[2/3] rounded-md overflow-hidden bg-gray-800 cursor-pointer relative group transition hover:ring-2 ring-gray-400">
                        <img src="\${img}" class="w-full h-full object-cover transition duration-300 group-hover:scale-105" alt="similar">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
                            <span class="text-white text-xs font-bold text-center px-2">\${s.title || s.name}</span>
                        </div>
                    </div>
                \`;
            }).join('');
            similarContainer.innerHTML = simH;
        }

    } catch (e) {
        console.error("Détail err", e);
    }
});
</script>
