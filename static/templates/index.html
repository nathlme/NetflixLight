<main class="bg-gray-950 min-h-screen text-white w-full overflow-x-hidden">
    <!-- Hero Section -->
    <div id="hero-banner" class="relative h-[65vh] md:h-[80vh] w-full bg-gray-800">
        <img id="hero-image" src="" alt="Hero Background" class="w-full h-full object-cover object-top transition-opacity duration-700">
        
        <div class="absolute inset-0 bg-gradient-to-t from-gray-950 via-gray-950/20 to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-r from-gray-950 via-gray-950/60 to-transparent w-full md:w-3/4"></div>
        
        <div class="absolute bottom-[10%] md:bottom-1/4 left-4 md:left-12 max-w-2xl z-10">
            <h1 id="hero-title" class="text-4xl md:text-6xl lg:text-7xl font-extrabold mb-2 md:mb-4 text-white drop-shadow-lg tracking-tight uppercase"></h1>
            <p id="hero-overview" class="text-sm md:text-lg text-gray-300 mb-6 drop-shadow-md line-clamp-3 md:line-clamp-none max-w-lg"></p>
            <div class="flex items-center gap-3 md:gap-4">
                <button id="hero-play-btn" class="bg-white text-black px-4 md:px-8 py-2 md:py-2.5 rounded md:rounded-md font-bold flex items-center justify-center gap-2 hover:bg-gray-200 transition hover:scale-105">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> 
                    <span class="text-base md:text-lg">Lecture</span>
                </button>
                <button id="hero-info-btn" class="bg-gray-600/70 text-white px-4 md:px-8 py-2 md:py-2.5 rounded md:rounded-md font-bold flex items-center justify-center gap-2 hover:bg-gray-600 transition hover:scale-105">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> 
                    <span class="text-base md:text-lg hidden md:block">Plus d'infos</span>
                    <span class="text-base md:text-lg md:hidden">Infos</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Conteneur des carousels -->
    <div id="carousels-container" class="px-4 md:px-12 -mt-12 md:-mt-24 relative z-20 space-y-8 md:space-y-12 pb-12">
        <!-- Vider car rempli dynamiquement -->
    </div>
</main>
